<!doctype html>
<!-- "Engine Kaput" HYROX trend, OSM version: graphics layer (transparent 1080x1920, every pixel from t).
     Captions = the locked OSM caption bar (#56A0FB, brand-white Inter 700 62 px, padding 14/30, radius 20, studio entrance:
     4 frames ease-out rise 10 px + scale 0.95 -> 1, 3-frame exit). Pain cards = Night dim layer (solid, no blur) with a clear
     circle on the body part, an error-red (#F26D6D, the brand's status red, always with a word) ring drawn once, and the word in
     Barlow Condensed Bold. Engine-kaput fade = Night layer rising to 35 %. Nothing loops or pulses (brand motion rule). -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: OSMInter; src: url('/osm/fonts/Inter[opsz,wght].ttf'); font-weight: 100 900; }
@font-face { font-family: Barlow; src: url('/osm/fonts/BarlowCondensed-Bold.ttf'); font-weight: 700; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
.layer { position: absolute; inset: 0; }
#cap .bar { position: absolute; font-family: OSMInter; font-weight: 700; font-size: 62px; line-height: 1.25; color: #E5EBF1;
  background: #56A0FB; border: 1px solid #56A0FB; padding: 14px 30px; border-radius: 20px; white-space: nowrap; transform-origin: 0 50%; }
#scan svg { position: absolute; inset: 0; }
#scan .w { position: absolute; font-family: Barlow; font-weight: 700; font-size: 84px; line-height: 1; color: #E5EBF1; letter-spacing: .04em; white-space: nowrap; }
#scan .w i { font-style: normal; color: #F26D6D; }
</style></head>
<body>
<div id="cap" class="layer" style="display:none"><div class="bar"></div></div>
<div id="scan" class="layer" style="display:none">
  <svg width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs><mask id="hole"><rect width="1080" height="1920" fill="#fff"/><circle id="hc" r="130" fill="#000"/></mask></defs>
    <rect width="1080" height="1920" fill="#0A0F16" fill-opacity="0.62" mask="url(#hole)"/>
    <circle id="ring" r="130" fill="none" stroke="#F26D6D" stroke-width="7"/>
    <line id="tick" stroke="#F26D6D" stroke-width="5"/>
  </svg>
  <div class="w"></div>
</div>
<div id="fade" class="layer" style="display:none;background:#0A0F16"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const spec = await (await fetch(q.get("spec"))).json();
const $ = (s) => document.querySelector(s);
const cl = (x) => Math.max(0, Math.min(1, x)), outC = (x) => 1 - Math.pow(1 - cl(x), 3), inC = (x) => Math.pow(cl(x), 3);
const show = (el, on) => { el.style.display = on ? "block" : "none"; };
window.seek = (t) => {
  // captions
  const c = spec.captions.find((x) => t >= x.start && t < x.end), cap = $("#cap"), bar = cap.querySelector(".bar");
  if (c) {
    show(cap, true);
    if (bar.dataset.t !== c.text) { bar.innerHTML = c.text; bar.dataset.t = c.text; }
    bar.style.left = c.x + "px"; bar.style.top = c.y + "px";
    const p = Math.min(outC((t - c.start) / (4 / 30)), 1 - inC((t - (c.end - 3 / 30)) / (3 / 30)));
    bar.style.opacity = c.cut_out ? Math.min(1, outC((t - c.start) / (4 / 30))) : p;
    bar.style.transform = `translateY(${10 * (1 - Math.min(1, outC((t - c.start) / (4 / 30))))}px) scale(${0.95 + 0.05 * Math.min(1, outC((t - c.start) / (4 / 30)))})`;
  } else show(cap, false);
  // pain cards (hard cuts, like the reference)
  const s = spec.cards.find((x) => t >= x.start && t < x.end), sc = $("#scan");
  if (s) {
    show(sc, true);
    const k = outC((t - s.start) / (6 / 30));                       // ring draws in over 6 frames, then holds
    const R = s.r || 130, r = R * (0.55 + 0.45 * k);
    $("#hc").setAttribute("cx", s.x); $("#hc").setAttribute("cy", s.y); $("#hc").setAttribute("r", r + 2);
    const ring = $("#ring"); ring.setAttribute("cx", s.x); ring.setAttribute("cy", s.y); ring.setAttribute("r", r);
    ring.setAttribute("stroke-opacity", cl((t - s.start) * 30 / 2));
    const w = sc.querySelector(".w");
    if (w.dataset.t !== s.word) { w.innerHTML = s.word; w.dataset.t = s.word; }
    const ww = w.getBoundingClientRect().width;
    const side = s.side || "left", lx = side === "left" ? s.x - R - 40 - ww : s.x + R + 40;
    w.style.left = lx + "px"; w.style.top = (s.y - 42) + "px"; w.style.opacity = cl((t - s.start - 2 / 30) * 30 / 3);
    const tk = $("#tick"), x1 = side === "left" ? s.x - R : s.x + R, x2 = side === "left" ? s.x - R - 30 : s.x + R + 30;
    tk.setAttribute("x1", x1); tk.setAttribute("x2", x2); tk.setAttribute("y1", s.y); tk.setAttribute("y2", s.y);
    tk.setAttribute("stroke-opacity", k);
  } else show(sc, false);
  // engine kaput: the picture sinks toward Night
  const f = spec.fade, fe = $("#fade");
  if (t >= f.start && t < f.end) { show(fe, true); fe.style.opacity = f.max * outC((t - f.start) / f.ramp); } else show(fe, false);
};
window.meta = { dur: spec.dur };
window.ready = document.fonts.ready;
</script></body></html>
