<!doctype html>
<!-- iFit White Friday Reel: graphics layer (transparent 1080x1920, every pixel from t). iFit identity: monochrome, the official
     iFit wordmark (ifit-eg.com/wp-content/uploads/2026/10/ifit-logo.svg, #4C4C4C, never cropped or recoloured), heavy clean
     sans-serif caps. Story (revised): the website opens (a WHITE FRIDAY label in the white margin above the page, nothing over the
     page) -> white flash -> training burst with WHITE / FRIDAY (white type, lower third, his face is above) -> WHITE FRIDAY IS HERE!
     -> logo. The term "Black Friday" is not used. No glow, no blur, no haze. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url('/osm/fonts/Inter[opsz,wght].ttf'); font-weight: 100 900; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
.layer { position: absolute; inset: 0; }
.H { font-family: Inter; font-weight: 900; text-transform: uppercase; letter-spacing: -0.045em; line-height: .86; white-space: nowrap; }
#lbl { inset: auto; left: 0; right: 0; top: 0; height: 108px; display: flex; align-items: center; justify-content: center; gap: 18px; }
#lbl .w { font-family: Inter; font-weight: 900; font-size: 52px; letter-spacing: .02em; color: #111; text-transform: uppercase; }
#lbl svg { width: 44px; }
#burst .w1 { position: absolute; left: 0; right: 0; top: 1250px; text-align: center; font-size: 280px; color: #fff; }
#flash { background: #fff; }
#end { background: #fff; }
#end .a { position: absolute; left: 0; right: 0; top: 690px; text-align: center; }
#end .a .l1 { font-size: 220px; color: #111; }
#end .a .l2 { font-size: 220px; color: #111; margin-top: 10px; }
#end .a .l3 { display: inline-block; font-size: 140px; color: #fff; background: #111; padding: 18px 34px 22px; border-radius: 18px; margin-top: 34px; letter-spacing: -0.03em; }
#end .b { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }
#end .b img { width: 640px; }
#end .b .cap { font-family: Inter; font-weight: 800; font-size: 40px; letter-spacing: .42em; color: #4C4C4C; margin: 70px 0 0 .42em; }
#end .b .pill { display: inline-block; margin-top: 70px; background: #111; color: #fff; font-family: Inter; font-weight: 800; font-size: 44px;
  letter-spacing: .04em; padding: 24px 50px; border-radius: 60px; }
</style></head>
<body>
<div id="lbl" class="layer" style="display:none"><span class="w">White Friday</span>
  <svg viewBox="0 0 100 92"><path d="M50 88 C20 66 4 50 4 30 C4 15 15 4 29 4 C38 4 46 9 50 17 C54 9 62 4 71 4 C85 4 96 15 96 30 C96 50 80 66 50 88 Z"
   fill="#fff" stroke="#111" stroke-width="8" stroke-linejoin="round"/></svg></div>
<div id="burst" class="layer" style="display:none"><div class="H w1"></div></div>
<div id="flash" class="layer" style="display:none"></div>
<div id="end" class="layer" style="display:none">
  <div class="a"><div class="H l1">WHITE</div><div class="H l2">FRIDAY</div><div class="H l3">IS HERE!</div></div>
  <div class="b"><img src="/proj/brand/ifit-logo.svg"><div class="cap">WHITE FRIDAY</div><div><span class="pill">SHOP NOW · ifit-eg.com</span></div></div>
</div>
<script type="module">
import { spring, clamp01 } from "/osm/motion-core.js";
const q = new URLSearchParams(location.search);
const spec = await (await fetch(q.get("spec"))).json();
const S = (n, st) => { for (const k in st) n.style[k] = st[k]; };
const sp = (t, t0, f = 3) => spring(t - t0, { freq: f });
const $ = (s) => document.querySelector(s);
const slam = (el, t, t0, f = 4.4, from = 1.35) => { const p = sp(t, t0, f); S(el, { opacity: clamp01((t - t0) * 24), transform: `scale(${from - (from - 1) * p})` }); };
const show = (el, on) => S(el, { display: on ? "block" : "none" });
window.seek = (t) => {
  const [s0, s1] = spec.screen, [b0, b1] = spec.broll, te = spec.end;
  // WHITE FRIDAY label in the white margin above the page, for the whole website shot (lands with the page on beat 1)
  const lb = $("#lbl");
  const lEnd = s1 - 4.5;                         // gone before the push-in on his card grows the page into the margin
  if (t >= s0 && t < lEnd) {
    S(lb, { display: "flex" });
    const p = sp(t, s0 + 0.05, 4.2);
    S(lb, { opacity: clamp01((t - s0 - 0.05) * 14) * (1 - clamp01((t - (lEnd - 0.25)) / 0.25)), transform: `translateY(${(1 - p) * -40}px) scale(${1.25 - 0.25 * p})` });
  } else S(lb, { display: "none" });
  // white flash out of the website into the burst (peaks on the cut)
  const fl = $("#flash");
  if (t >= b0 - 0.12 && t < b0 + 0.22) { show(fl, true); S(fl, { opacity: t < b0 ? (t - (b0 - 0.12)) / 0.12 : 1 - (t - b0) / 0.22 }); } else show(fl, false);
  // burst: WHITE (first half), FRIDAY (second half), slammed on the beats
  const bu = $("#burst"), w = bu.querySelector(".w1"), mid = b0 + (b1 - b0) / 2;
  if (t >= b0 && t < b1) {
    show(bu, true);
    const word = t < mid ? "WHITE" : "FRIDAY";
    if (w.textContent !== word) w.textContent = word;
    slam(w, t, t < mid ? b0 + 0.02 : mid);
  } else show(bu, false);
  // END: white floods out from the centre -> WHITE FRIDAY IS HERE! -> the iFit logo
  const en = $("#end");
  if (t >= te) {
    show(en, true);
    const r = 1150 * Math.min(1, Math.pow(clamp01((t - te) / 0.2), 0.7));
    S(en, { clipPath: `circle(${r}px at 50% 50%)` });
    const a = en.querySelector(".a"), b = en.querySelector(".b");
    const ax = clamp01((t - (te + 2.0)) / 0.22);
    S(a, { opacity: 1 - ax, transform: `translateY(${-120 * ax}px)` });
    slam(a.querySelector(".l1"), t, te + 0.06); slam(a.querySelector(".l2"), t, te + 0.27); slam(a.querySelector(".l3"), t, te + 0.52, 4.4, 1.6);
    if (t >= te + 2.0) {
      S(b, { display: "block" });
      const p = sp(t, te + 2.05, 2.8);
      S(b.querySelector("img"), { opacity: clamp01((t - te - 2.05) * 8), transform: `scale(${0.86 + 0.14 * p})` });
      S(b.querySelector(".cap"), { opacity: clamp01((t - te - 2.4) * 6) });
      const pp = sp(t, te + 2.6, 3.2);
      S(b.querySelector(".pill"), { opacity: clamp01((t - te - 2.6) * 7), transform: `translateY(${(1 - pp) * 40}px)` });
    } else S(b, { display: "none" });
  } else show(en, false);
};
window.meta = { dur: spec.dur };
window.ready = document.fonts.ready.then(() => new Promise((r) => { const im = document.querySelector("#end img"); im.complete ? r() : (im.onload = r, im.onerror = r); }));
</script></body></html>
